name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permitir solo un deployment concurrente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # En un push a main se corre la suite completa antes de publicar. El despliegue
  # lanzado con workflow_dispatch (el bot de Instagram, o a mano desde Actions)
  # no la corre: los posts no deben dejar de publicarse por un fallo de la suite.
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    # Publica si la suite pasó, o si no correspondía correrla (workflow_dispatch)
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No se publica si la versión de caché es inconsistente, o si el push
      # modificó archivos del sitio sin subirla (python api/bump_version.py).
      - name: Verificar versión de caché
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 api/bump_version.py --check
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ]; then
            git fetch --quiet --depth=1 origin "$BEFORE" || true
            python3 api/bump_version.py --verify "$BEFORE" "$GITHUB_SHA"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
