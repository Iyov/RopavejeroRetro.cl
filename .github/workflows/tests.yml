name: Tests

# En los push a main esta suite la corre deploy-pages.yml (workflow_call),
# que solo publica si pasa. Aquí se dispara en pull requests y a mano.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests de JavaScript
        run: npm run test:js

      - name: Tests de Python
        run: npm run test:py
